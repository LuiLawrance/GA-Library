<div class="events-page page" id="events-page">
    <div class="events-content">
        <!-- ── Stored events ── -->
        <div class="events-panel panel events-list-panel">
            <div class="events-panel-header">
                <span class="label label--muted">Events</span>
                <span class="events-count label label--muted label--sm" id="events-count"></span>
            </div>

            <!-- Filters the stored list by text; an Omnidex event ID / URL
                 that isn't stored yet is fetched from the API on Enter (the
                 API can't list events, so this is how one gets stored). -->
            <div class="events-filter">
                <input type="text" id="events-filter-input" class="inv-text-input"
                       placeholder="Search or event ID / URL" autocomplete="off"
                       oninput="renderEventList()" onkeydown="handleEventSearchKeydown(event)">
                <!-- Shared .select-dropdown (dropdown.js), filled by loadEventList. -->
                <div class="events-category" id="events-filter-category"></div>
            </div>
            <div class="events-search-msg hidden" id="events-search-msg"></div>

            <div class="events-list scroll-thin" id="events-list"></div>
        </div>

        <!-- ── Selected event ── -->
        <!-- The panel frame stays put; #events-detail inside it is what
             fades when switching events (fadeSwap, animation.js). -->
        <div class="events-panel panel events-detail-panel">
            <div class="events-detail-inner" id="events-detail">
                <div class="events-placeholder">
                    <span class="inv-empty-icon">🏆</span>
                    <p>Select an event to see its standings, pairings, and decklists.</p>
                </div>
            </div>
        </div>
    </div>
</div>
