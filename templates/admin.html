<div class="admin-page" id="admin-page">
    <div class="page-header">
        <span class="page-label">Admin Console</span>
        <nav class="admin-subnav">
            <button class="admin-subnav-btn" data-section="system" onclick="switchAdminSection('system')">
                System
            </button>
            <button class="admin-subnav-btn active" data-section="pricing" onclick="switchAdminSection('pricing')">
                Cards
            </button>
            <button class="admin-subnav-btn" data-section="users" onclick="switchAdminSection('users')">
                Users
            </button>
        </nav>
    </div>

    <div class="admin-content">
        <div class="admin-section hidden" id="admin-section-system">
            <span class="admin-section-title">System</span>
            <div class="admin-system-options" id="admin-system-settings">
                <div class="admin-system-option-row">
                    <span class="admin-system-option-name">Store Images Locally</span>
                    <div class="admin-pid-source-toggle admin-system-option-toggle" data-setting="store_images_locally">
                        <span class="pill-indicator"></span>
                        <button type="button" class="admin-pid-source-toggle-btn active" data-value="false"
                                onclick="updateAdminSystemSetting('store_images_locally', false)">Off</button>
                        <button type="button" class="admin-pid-source-toggle-btn" data-value="true"
                                onclick="updateAdminSystemSetting('store_images_locally', true)">On</button>
                    </div>
                </div>
                <div class="admin-system-option-row">
                    <span class="admin-system-option-name">Local Database</span>
                    <div class="admin-pid-source-toggle admin-system-option-toggle" data-setting="local_database">
                        <span class="pill-indicator"></span>
                        <button type="button" class="admin-pid-source-toggle-btn active" data-value="false"
                                onclick="updateAdminSystemSetting('local_database', false)">Off</button>
                        <button type="button" class="admin-pid-source-toggle-btn" data-value="true"
                                onclick="updateAdminSystemSetting('local_database', true)">On</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="admin-section hidden" id="admin-section-users">
            <span class="admin-section-title">User Management</span>
            <div class="admin-user-controls">
                <input type="text" class="admin-pid-search" id="admin-user-search"
                       placeholder="Search users..." oninput="renderAdminUserRows()">
                <div class="admin-user-role-actions">
                    <button class="admin-pid-refresh-btn admin-pid-refresh-btn-secondary" id="admin-user-promote-btn"
                            onclick="promoteAdminUser()" disabled>Promote</button>
                    <button class="admin-pid-refresh-btn admin-pid-refresh-btn-secondary" id="admin-user-demote-btn"
                            onclick="demoteAdminUser()" disabled>Demote</button>
                </div>
                <div class="admin-user-summary" id="admin-user-summary"></div>
            </div>

            <div class="admin-user-layout">
                <div class="admin-user-list" id="admin-user-list">
                    <div class="admin-user-table-header" id="admin-user-table-header">
                        <div class="admin-user-row admin-user-row-header">
                            <span class="admin-user-col-name">Username</span>
                            <span class="admin-user-col-role">Role</span>
                            <span class="admin-user-col-delete"></span>
                        </div>
                    </div>
                    <div class="admin-user-table-scroll">
                        <div class="admin-user-table" id="admin-user-table"></div>
                    </div>
                </div>
                <div class="admin-user-profile-col" id="admin-user-profile-col">
                    <div class="admin-pid-detail-empty">Select a user from the list to view their profile.</div>
                </div>
                <div class="admin-user-detail" id="admin-user-detail"></div>
            </div>
        </div>

        <div class="admin-section" id="admin-section-pricing">
            <div class="admin-pid-controls-row admin-cards-header-row">
                <div class="admin-cards-subnav">
                    <span class="pill-indicator"></span>
                    <button class="admin-cards-subnav-btn" data-view="info" onclick="switchAdminCardsView('info')">Info</button>
                    <button class="admin-cards-subnav-btn active" data-view="pricing" onclick="switchAdminCardsView('pricing')">Pricing</button>
                </div>
                <input type="text" class="admin-pid-search" id="admin-pid-search"
                       placeholder="Search cards or sets..." oninput="renderAdminPidRows()">
                <label class="admin-pid-filter-toggle">
                    <input type="checkbox" id="admin-pid-missing-only" onchange="renderAdminPidRows()">
                    Missing only
                </label>
            </div>

            <!-- Info and Pricing share this single grid/detail view — switchAdminCardsView
                 toggles admin-cards-mode-info on the section (see admin.css) to collapse
                 the pricing-only columns/controls rather than swapping in a separate view. -->
            <div class="admin-cards-view" id="admin-cards-view">
                <div class="admin-pid-controls">
                    <div class="admin-pid-controls-grid">
                        <div class="admin-pid-controls-cell-list">
                            <div class="admin-pid-status-group">
                                <div class="admin-pid-summary" id="admin-pid-summary"></div>
                                <div class="admin-pid-progress hidden" id="admin-pid-progress"></div>
                            </div>
                            <button class="admin-pid-tcg-btn" id="admin-pid-tcg-btn" onclick="openAdminPidTcgPlayer()"
                                    title="TCG Player" disabled>
                                <img src="/marketplaces/TCG%20Player.png" alt="TCG Player" class="admin-pid-tcg-icon">
                            </button>
                        </div>
                        <div class="admin-pid-controls-cell-image"></div>
                        <div class="admin-pid-controls-cell-detail">
                            <div class="admin-pid-source-toggle" id="admin-pid-source-toggle">
                                <span class="pill-indicator"></span>
                                <button type="button" class="admin-pid-source-toggle-btn active" data-mode="regular"
                                        onclick="switchAdminPidDetailMode('regular')">Regular</button>
                                <button type="button" class="admin-pid-source-toggle-btn" data-mode="discord"
                                        onclick="switchAdminPidDetailMode('discord')">Discord</button>
                            </div>
                            <div class="admin-pid-refresh-group">
                                <button class="admin-pid-refresh-btn admin-pid-refresh-btn-secondary" id="admin-pid-refresh-btn-sales"
                                        onclick="refreshSelectedAdminPricing('sales')" disabled>Refresh Sales</button>
                                <button class="admin-pid-refresh-btn admin-pid-refresh-btn-secondary" id="admin-pid-refresh-btn-listings"
                                        onclick="refreshSelectedAdminPricing('listings')" disabled>Refresh Listings</button>
                                <button class="admin-pid-refresh-btn" id="admin-pid-refresh-btn-both"
                                        onclick="refreshSelectedAdminPricing('both')" disabled>Refresh Selected</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="admin-pricing-layout">
                    <div class="admin-pricing-list" id="admin-pricing-list">
                        <div class="admin-pid-table-header" id="admin-pid-table-header"></div>
                        <div class="admin-pid-table-scroll">
                            <div class="admin-pid-table" id="admin-pid-table"></div>
                        </div>
                    </div>
                    <div class="admin-pricing-image-col" id="admin-pricing-image-col">
                        <div class="admin-pid-detail-empty">Select a card from the list to view its pricing details.</div>
                    </div>
                    <div class="admin-pricing-detail" id="admin-pricing-detail"></div>
                    <div class="admin-pricing-sets" id="admin-pricing-sets"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card-drawer hidden" id="card-drawer">
        <div class="drawer-inner">
            <div id="drawer-content"></div>
        </div>
    </div>
    <div class="drawer-sidebar hidden" id="drawer-sidebar">
        <button class="drawer-sidebar-close" onclick="closeCardDrawer()">&#x2715;</button>
        <div class="drawer-sidebar-divider"></div>
        <button class="drawer-sidebar-btn active" data-tab="info" onclick="switchDrawerTab('info', 'card-drawer')"
                title="Info">ℹ️
        </button>
        <button class="drawer-sidebar-btn" data-tab="thema" onclick="switchDrawerTab('thema', 'card-drawer')"
                title="Thema">🏷️
        </button>
        <button class="drawer-sidebar-btn" data-tab="pricing" onclick="switchDrawerTab('pricing', 'card-drawer')"
                title="Pricing">💵
        </button>
    </div>
</div>
