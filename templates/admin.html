<div class="admin-page" id="admin-page">
    <div class="page-header">
        <span class="page-label">Admin Console</span>
        <nav class="admin-subnav">
            <button class="admin-subnav-btn active" data-section="pricing" onclick="switchAdminSection('pricing')">
                Pricing
            </button>
            <button class="admin-subnav-btn" data-section="users" onclick="switchAdminSection('users')">
                Users
            </button>
        </nav>
    </div>

    <div class="admin-content">
        <div class="admin-section hidden" id="admin-section-users">
            <span class="admin-section-title">User Management</span>
            <p class="admin-section-placeholder">Coming soon.</p>
        </div>

        <div class="admin-section" id="admin-section-pricing">
            <span class="admin-section-title">Pricing</span>
            <div class="admin-pid-controls">
                <input type="text" class="admin-pid-search" id="admin-pid-search"
                       placeholder="Search cards or sets..." oninput="renderAdminPricingIds()">
                <label class="admin-pid-filter-toggle">
                    <input type="checkbox" id="admin-pid-missing-only" onchange="renderAdminPricingIds()">
                    Missing only
                </label>
                <div class="admin-pid-refresh-group">
                    <button class="admin-pid-refresh-btn admin-pid-refresh-btn-secondary" id="admin-pid-refresh-btn-sales"
                            onclick="refreshSelectedAdminPricing('sales')" disabled>Refresh Sales</button>
                    <button class="admin-pid-refresh-btn admin-pid-refresh-btn-secondary" id="admin-pid-refresh-btn-listings"
                            onclick="refreshSelectedAdminPricing('listings')" disabled>Refresh Listings</button>
                    <button class="admin-pid-refresh-btn" id="admin-pid-refresh-btn-both"
                            onclick="refreshSelectedAdminPricing('both')" disabled>Refresh Selected</button>
                </div>
            </div>
            <div class="admin-pid-status-row">
                <div class="admin-pid-summary" id="admin-pid-summary"></div>
                <div class="admin-pid-progress hidden" id="admin-pid-progress"></div>
            </div>

            <div class="admin-pricing-layout">
                <div class="admin-pricing-list">
                    <div class="admin-pid-table-header" id="admin-pid-table-header"></div>
                    <div class="admin-pid-table-scroll">
                        <div class="admin-pid-table" id="admin-pid-table"></div>
                    </div>
                </div>
                <div class="admin-pricing-image-col" id="admin-pricing-image-col">
                    <div class="admin-pid-detail-empty">Select a card from the list to view its pricing details.</div>
                </div>
                <div class="admin-pricing-detail" id="admin-pricing-detail"></div>
            </div>
        </div>
    </div>

    <div class="card-drawer hidden" id="card-drawer">
        <div class="drawer-inner">
            <div id="drawer-content"></div>
        </div>
    </div>
    <div class="drawer-sidebar hidden" id="drawer-sidebar">
        <button class="drawer-sidebar-close" onclick="closeCardDrawer()">&#x2715;</button>
        <div class="drawer-sidebar-divider"></div>
        <button class="drawer-sidebar-btn active" data-tab="info" onclick="switchDrawerTab('info', 'card-drawer')"
                title="Info">ℹ️
        </button>
        <button class="drawer-sidebar-btn" data-tab="thema" onclick="switchDrawerTab('thema', 'card-drawer')"
                title="Thema">🏷️
        </button>
        <button class="drawer-sidebar-btn" data-tab="pricing" onclick="switchDrawerTab('pricing', 'card-drawer')"
                title="Pricing">💵
        </button>
    </div>
</div>
