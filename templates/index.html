<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/animation.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/tiles.css">
    <link rel="stylesheet" href="/static/css/cards.css">
    <link rel="stylesheet" href="/static/css/drawer.css">
    <link rel="stylesheet" href="/static/css/collection.css">
    <link rel="stylesheet" href="/static/css/decks.css">
    <link rel="stylesheet" href="/static/css/prices.css">
    <link rel="stylesheet" href="/static/css/inventory.css">
    <link rel="stylesheet" href="/static/css/decks_ga.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/profile.css">
</head>
<body>

<!-- Top bar -->
<div class="topbar">
    <a href="/" class="topbar-brand" data-link>GA Library</a>
    <div class="topbar-right">
        <div id="topbar-user-menu" class="topbar-user-menu hidden">
            <button id="topbar-user-btn" class="topbar-user" onclick="toggleUserMenu(event)">
                <span id="topbar-user-name"></span>
                <span class="dropdown-arrow">&#8249;</span>
            </button>
            <div id="topbar-user-dropdown" class="menu topbar-user-dropdown hidden">
                <a href="/profile" class="topbar-user-item" data-link>Profile</a>
                <button type="button" class="topbar-user-item" onclick="handleLogout()">Logout</button>
            </div>
        </div>
        <a id="topbar-login-btn" class="btn-login btn btn--ghost" data-link href="/login">Login</a>
    </div>
</div>

<!-- Navbar -->
<nav class="navbar">
    <a href="/" data-link>Home</a>
    <a href="/cards" data-link>Cards</a>
    <a href="/collection" data-link>Collection</a>
    <a href="/decks" data-link>Decks</a>
    <a href="/prices" data-link>Prices</a>
    <div class="navbar-right">
        <a href="/admin" id="nav-admin" class="nav-admin hidden" data-link>Admin</a>
        <a href="/decks_ga" id="nav-decks-ga" class="nav-decks-ga hidden" data-link>My Decks</a>
        <a href="/inventory" id="nav-inventory" class="nav-inventory hidden" data-link>Inventory</a>
    </div>
</nav>

<!-- Content area -->
<main id="content" class="content"></main>

<!-- Footer -->
<footer class="footer">
    A Lawrance Lui project
</footer>

<!-- Blocking account-setup gate — shown when an admin has cleared this user's
     Omnidex ID and/or password (see maybeShowAccountSetup in app.js). No way
     to dismiss it; the backend also 403s other API calls until it's done. -->
<div id="account-setup-modal" class="setup-overlay hidden">
    <div class="setup-card">
        <div class="setup-header">
            <span class="setup-label label">Account setup required</span>
            <h2 class="setup-title" id="setup-title">Set your Omnidex ID</h2>
        </div>
        <p class="setup-desc" id="setup-desc"></p>
        <div class="setup-error error-msg" id="setup-error"></div>

        <div class="setup-step" id="setup-step-omnidex">
            <label class="label label--muted label--sm" for="setup-omnidex-input">Omnidex ID</label>
            <input type="text" id="setup-omnidex-input" inputmode="numeric" autocomplete="off"
                   placeholder="Your Omnidex ID number"
                   onkeydown="if (event.key === 'Enter') submitAccountSetup()">
        </div>

        <div class="setup-step hidden" id="setup-step-password">
            <label class="label label--muted label--sm" for="setup-password-input">New password</label>
            <input type="password" id="setup-password-input" autocomplete="new-password">
            <label class="label label--muted label--sm" for="setup-password-confirm">Confirm password</label>
            <input type="password" id="setup-password-confirm" autocomplete="new-password"
                   onkeydown="if (event.key === 'Enter') submitAccountSetup()">
        </div>

        <button class="btn btn--primary setup-submit" id="setup-submit" onclick="submitAccountSetup()">Continue</button>
    </div>
</div>

<!-- Global delete-confirmation modal -->
<div id="app-confirm-modal" class="inv-modal-overlay overlay hidden" onclick="appConfirmResolve(false)">
    <div class="inv-modal modal" onclick="event.stopPropagation()">
        <div class="inv-modal-header">
            <span class="inv-modal-title" id="app-confirm-title">Confirm</span>
            <button class="inv-modal-close" onclick="appConfirmResolve(false)">✕</button>
        </div>
        <div class="inv-move-card-info" id="app-confirm-message"></div>
        <div class="inv-modal-field">
            <label class="inv-field-label label label--muted" for="app-confirm-input">Type <b>confirm</b> to proceed</label>
            <input type="text" class="inv-modal-input" id="app-confirm-input"
                   placeholder="confirm" autocomplete="off"
                   oninput="appConfirmValidate()" onkeydown="appConfirmKeydown(event)">
        </div>
        <div class="inv-modal-actions">
            <button class="inv-modal-danger" id="app-confirm-btn" onclick="appConfirmResolve(true)" disabled>Delete
            </button>
        </div>
    </div>
</div>

<script src="/static/js/drawer.js"></script>
<script src="/static/js/login.js"></script>
<script src="/static/js/tiles.js"></script>
<script src="/static/js/animation.js"></script>
<script src="/static/js/cards.js"></script>
<script src="/static/js/collection.js"></script>
<script src="/static/js/decks.js"></script>
<script src="/static/js/prices.js"></script>
<script src="/static/js/inventory.js"></script>
<script src="/static/js/decks_ga.js"></script>
<script src="/static/js/admin.js"></script>
<script src="/static/js/profile.js"></script>
<script src="/static/js/app.js"></script>

</body>
